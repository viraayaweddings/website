<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
    <h1>Session Info <button type='button' id='toggleConnection'>Connect</button></h1>
    <p><i class="lastRefreshed">Last refreshed <span id='lastRefresh'></span></i></p>
    <div id="sessionInfoContainer">
      <h2>Browser Info <button type='button' class="collapseToggle" data-target="browserInfo">Expand</button></h2>
      <ul id="browserInfo" class="collapsed"></ul>
      <h2>Detected Accounts <button type='button' class="collapseToggle" data-target="detectedAccounts">Expand</button></h2>
      <ul id="detectedAccounts" class="collapsed"></ul>
      <h2>Tabs <button type='button' class="collapseToggle" data-target="tabs">Expand</button></h2>
      <ul id="tabs" class="collapsed"></ul>
      <h2>User Info <button type='button' class="collapseToggle" data-target="userInfo">Expand</button></h2>
      <ul id="userInfo" class="collapsed"></ul>
      <h2>User Trust <button type='button' class="collapseToggle" data-target="userTrust">Expand</button> <button type='button' id="clearUserTrustCache">Clear User Trust Cache</button></h2>
      <ul id="userTrust" class="collapsed"></ul>
      <h2>Settings <button type='button' class="collapseToggle" data-target="settings">Expand</button></h2>
      <ul id="settings" class="collapsed"></ul>
      <h2>Downloads <button type='button' class="collapseToggle" data-target="downloads">Expand</button></h2>
      <ul id="downloads" class="collapsed"></ul>
      <h2>Copy/Paste <button type='button' class="collapseToggle" data-target="copyPaste">Expand</button></h2>
      <ul id="copyPaste" class="collapsed"></ul>
    </div>
    <h1>Raw Message</h1>
    <textarea id="rawMessage" class="rawMessage"></textarea>
  </body>
</html>
