name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run docs:validate
      - run: npm run test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify render scripts compile
        run: python -m py_compile build/verify-blog-render.py build/verify-city-render.py build/verify-hotel-render.py build/verify-singleton-render.py
